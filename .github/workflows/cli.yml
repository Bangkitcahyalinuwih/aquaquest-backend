name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, gd, intl, zip, bcmath, exif
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env && php artisan key:generate
      - name: Gaya kode (Pint)
        run: vendor/bin/pint --test
      - name: Test (Pest, SQLite in-memory)
        run: php artisan test
